name: makeit ARM64 APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate welcome artwork
        run: |
          ls -la
          find . -iname '*.png' -not -path './.git/*'
          file=fon.png
          test -s "$file"
          mkdir -p app/src/main/res/drawable-nodpi
          cp "$file" app/src/main/res/drawable-nodpi/welcome_background.png
          test -s iconka.png
          test -s background.png
          cp iconka.png app/src/main/res/drawable-nodpi/makeit_icon.png
          cp background.png app/src/main/res/drawable-nodpi/makeit_background.png
      - name: Compile ARM64 APK after editor scope fix
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare phone APK
        run: |
          cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk makeit.apk
          test -s makeit.apk
          ls -lh makeit.apk
          du -h app/build/generated/ideaAssets
          unzip -l makeit.apk | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: makeit
          path: makeit.apk
          if-no-files-found: error
