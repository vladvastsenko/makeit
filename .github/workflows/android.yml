name: makeit offline catalog APKs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate welcome artwork
        run: |
          ls -la
          find . -iname '*.png' -not -path './.git/*'
          file=fon.png
          test -s "$file"
          mkdir -p app/src/main/res/drawable-nodpi
          cp "$file" app/src/main/res/drawable-nodpi/welcome_background.png
          test -s icon.png
          test -s background.png
          cp icon.png app/src/main/res/drawable-nodpi/makeit_icon.png
          cp background.png app/src/main/res/drawable-nodpi/makeit_background.png
      - run: gradle :app:assembleDebug --stacktrace
      - name: Verify and report APK sizes
        run: |
          echo '### APK sizes' >> "$GITHUB_STEP_SUMMARY"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            file="app/build/outputs/apk/debug/app-$abi-debug.apk"
            test -s "$file"
            bytes=$(stat -c%s "$file")
            echo "$abi: $bytes bytes"
            echo "- $abi: $bytes bytes" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Prepare phone APK
        run: cp app/build/outputs/apk/debug/app-arm64-v8a-debug.apk makeit.apk
      - uses: actions/upload-artifact@v4
        with:
          name: makeit-arm64-v8a
          path: makeit.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MakeIt-armeabi-v7a
          path: app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MakeIt-x86_64
          path: app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: error
