name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate welcome artwork
        run: |
          ls -la
          find . -iname '*.png' -not -path './.git/*'
          file=fon.png
          test -s "$file"
          mkdir -p app/src/main/res/drawable-nodpi
          cp "$file" app/src/main/res/drawable-nodpi/welcome_background.png
          test -s icon.png
          test -s background.png
          cp icon.png app/src/main/res/drawable-nodpi/makeit_icon.png
          cp background.png app/src/main/res/drawable-nodpi/makeit_background.png
      - run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MakeIt
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
